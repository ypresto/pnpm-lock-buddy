name: Test duplicates action

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-action:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pack the current commit instead of relying on `version` defaulting to
      # package.json's version and fetching that from npm: package.json is
      # routinely bumped ahead of the matching `npm publish`, which would
      # otherwise make this job fail on every push until publish catches up,
      # and even once published it would only ever test the last release
      # rather than this commit's code.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Pack tarball
        id: pack
        run: echo "path=$(pnpm pack --pack-destination /tmp)" >> "$GITHUB_OUTPUT"

      # Test: should detect duplicates and fail
      - name: Run duplicates check (expect duplicates)
        id: duplicates
        uses: ./duplicates
        continue-on-error: true
        with:
          version: ${{ steps.pack.outputs.path }}
          packages: 'chalk'
          per-project: 'false'
          comment: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}

      - name: Verify duplicates were detected
        shell: bash
        run: |
          if [ "${{ steps.duplicates.outputs.has-duplicates }}" != "true" ]; then
            echo "::error::Expected has-duplicates=true but got ${{ steps.duplicates.outputs.has-duplicates }}"
            exit 1
          fi
          echo "Action correctly detected duplicates"

      # Test: should pass with no duplicates for a non-existent-in-lockfile filter
      - name: Run duplicates check (expect no duplicates)
        id: no-duplicates
        uses: ./duplicates
        with:
          version: ${{ steps.pack.outputs.path }}
          packages: 'commander'
          per-project: 'false'

      - name: Verify no duplicates
        shell: bash
        run: |
          if [ "${{ steps.no-duplicates.outputs.has-duplicates }}" != "false" ]; then
            echo "::error::Expected has-duplicates=false but got ${{ steps.no-duplicates.outputs.has-duplicates }}"
            exit 1
          fi
          echo "Action correctly reported no duplicates"
